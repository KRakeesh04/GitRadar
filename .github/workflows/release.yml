name: Build and Release GitRadar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''

          - platform: windows-latest
            args: ''

          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        # v5 uses the Node 24 runtime required by GitHub-hosted runners.
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        # v0.6.2 includes the current release-upload handling and Node 24 runtime.
        # Pinning avoids the legacy v1 tag used by the cancelled Windows release.
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: 'GitRadar ${{ github.ref_name }}'
          releaseBody: |
            ## GitRadar ${{ github.ref_name }}

            Download the installer for your operating system below.

            ### Downloads

            - **Linux:** `.deb`, `.rpm`, or `.AppImage`
            - **Windows:** `.msi` or `.exe`
            - **macOS:** `.dmg`

          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
