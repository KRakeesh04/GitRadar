# Rust formatter configuration

# Maximum width of each line
max_width = 100

# Maximum width of the args of a function call before falling back to vertical formatting
fn_call_width = 80

# Maximum width of the args of a function-like attributes before falling back to vertical formatting
attr_fn_like_width = 70

# Maximum width of a struct literal before falling back to vertical formatting
struct_lit_width = 60

# Maximum width of a struct variant before falling back to vertical formatting
struct_variant_width = 60

# Maximum width of an array literal before falling back to vertical formatting
array_width = 60

# Maximum width of a chain to fit on a single line
chain_width = 80

# How to use tabs
hard_tabs = false
tab_spaces = 4

# Control the case of the letters in hexadecimal literal values
hex_literal_case = "lower"

# Style of editing in multi-line strings and comments
wrap_comments = true
format_code_in_doc_comments = true
comment_width = 80

# Imports formatting
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
reorder_imports = true

# Control the layout of items
reorder_modules = true
reorder_impl_items = true

# Control the formatting of trailing commas
trailing_comma = "Vertical"

# Control the formatting of spaces around commas
spaces_around_ranges = false

# Binop formatting
binop_separator = "Front"

# Remove nested parens
remove_nested_parens = true

# Use field init shorthand when possible
use_field_init_shorthand = true

# Use try shorthand for ? operator
use_try_shorthand = true

# Format string literals where possible
format_strings = false

# Control the formatting of control flow braces
control_brace_style = "AlwaysSameLine"

# Brace style for structs, enums, etc.
brace_style = "SameLineWhere"

# Empty item formatting
empty_item_single_line = true

# Where to put the opening brace of structs
struct_lit_single_line = true

# Where to put the opening brace of enums
enum_single_line = true

# Format generated files
format_generated_files = false

# Merge imports
merge_derives = true

# Condense wildcard imports
condense_wildcard_suffixes = true
